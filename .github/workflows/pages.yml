name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Laat een lopende deploy afmaken; nieuwe pushes wachten netjes op hun beurt.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Syntaxcheck
        run: node --check app.js

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # Statische site zonder build: de repo-root is het artifact.
      # De action laat .git en .github er zelf al buiten.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
